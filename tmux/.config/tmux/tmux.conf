set -g @catppuccin_flavor 'mocha'
run ~/.config/tmux/plugins/catppuccin/catppuccin.tmux

set -g status-left ""
set -g window-status-current-format '#[fg=#{@thm_peach},bg=#{@thm_crust}]#[fg=#{@thm_crust},bg=#{@thm_peach}]#W | #I#[fg=#{@thm_peach},bg=#{@thm_crust}]'
set -g window-status-format "#[fg=#{@thm_overlay_0},bg=#{@thm_crust}]#[fg=#{@thm_fg},bg=#{@thm_overlay_0}]#W | #I#[fg=#{@thm_overlay_0},bg=#{@thm_crust}]"

set -g window-status-current-style "fg=#{@thm_crust},bg=#{@thm_peach}"
set -g window-status-style "fg=#{@thm_fg},bg=#{@thm_overlay_0}"
set -g status-right ""
