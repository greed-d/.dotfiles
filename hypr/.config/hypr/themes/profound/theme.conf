# This controls all visual elements of hyprland : 
# See more at : https://wiki.hyprland.org/Configuring/Variables/
$THEME_DIR=$HOME/Pictures/Wallpapers/

#Apply opacity to apps
# Kind of ugly way but works fine
windowrulev2 = opacity 0.90 0.90,class:^(zen-alpha|[Tt]hunar|Slack|discord|Spotify|neovide|kitty|[Aa]rm[Cc]ord|vesktop|org.wezfurlong.wezterm|com.mitchellh.ghostty|YouTube Music|obsidian)$

# If you want to change opacity of specific app
# windowrulev2 = opacity 0.90 0.90,class:^(Some-app-class)$

general {
    col.active_border=0xFF53E2AE
    col.inactive_border=0xFFF48FB1
    border_size=2
    col.active_border = rgb(cba6f7)
    col.inactive_border = rgb(24273A)
    gaps_in=2
    gaps_out=4
}

decoration {
  
  rounding=0

  shadow {
    enabled = true
    range = 30
    color = 0x44000000
  }
  
  blur {
      enabled = yes
      size = 4
      passes = 4
      new_optimizations = on
      ignore_opacity = on
      xray = false
  }
  
}

# Setting animations: 
# See more at : https://wiki.hyprland.org/Configuring/Animations/
animations {
    enabled = true
    bezier = linear, 0, 0, 1, 1
    bezier = md3_standard, 0.2, 0, 0, 1
    bezier = md3_decel, 0.05, 0.7, 0.1, 1
    bezier = md3_accel, 0.3, 0, 0.8, 0.15
    bezier = overshot, 0.05, 0.9, 0.1, 1.1
    bezier = crazyshot, 0.1, 1.5, 0.76, 0.92 
    bezier = hyprnostretch, 0.05, 0.9, 0.1, 1.0
    bezier = menu_decel, 0.1, 1, 0, 1
    bezier = menu_accel, 0.38, 0.04, 1, 0.07
    bezier = easeInOutCirc, 0.85, 0, 0.15, 1
    bezier = easeOutCirc, 0, 0.55, 0.45, 1
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    bezier = softAcDecel, 0.26, 0.26, 0.15, 1
    bezier = md2, 0.4, 0, 0.2, 1 # use with .2s duration
    bezier = liner, 1, 1, 1, 1
    
    # Animation configs
    animation = windows, 1, 7, md3_decel, popin 60%
    animation = windowsIn, 1, 7, md3_decel, popin 60%
    animation = windowsOut, 1, 7, md3_accel, popin 60%
    animation = border, 1, 7, default
    animation = fade, 1, 7, md3_decel
    animation = border, 1, 1, liner
    # animation = borderangle, 1, 180, liner, loop #used by rainbow borders and rotating colors
    # animation = layers, 1, 2, md3_decel, slide
    animation = layersIn, 1, 6, menu_decel, slide
    animation = layersOut, 1, 1.6, menu_accel
    animation = fadeLayersIn, 1, 2, menu_decel
    animation = fadeLayersOut, 1, 4.5, menu_accel
    animation = workspaces, 1, 5, menu_decel, slide
    # animation = workspaces, 1, 2.5, softAcDecel, slide
    # animation = workspaces, 1, 7, menu_decel, slidefade 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidefadevert 15%
    # animation = specialWorkspace, 1, 3, md3_decel, slidevert
}


#Enable window swallowing 
misc {
  enable_swallow = true
  swallow_regex = ^(neovide)$
}

