# Umbriel default config
# Copy this file to ~/.config/umbriel/config.toml to customize it.
# Changes apply on save. See docs/user/ for the full reference.
#
# [include] merges extra files into this one. Included files are parsed first,
# in list order (later files override earlier ones), then everything in this
# file overrides all of them. That is why Noctalia's dynamic theming can render
# its palette into a separate noctalia.toml and still let you override the
# generated colors here.

# Includes -------------------------------------------------------------------

[include]
files = [
  "core/general.toml",    # general, workspaces, overview, hot corners, layout
  "core/monitor.toml",    # outputs
  "core/input.toml",      # keyboard, mouse, touchpad, tablet, cursor
  "core/keybinds.toml",   # key and mouse bindings
  "core/env.toml",        # environment variables
  "core/execs.toml",      # startup commands (placeholder)
  "core/appearance.toml", # borders, corners, blur, shadows
  "core/animation.toml",  # animation timing and easing
  "core/windowrule.toml", # window rules
  "core/layerrule.toml",  # layer rules (shell surfaces)
  ]

# Rendered by Noctalia's dynamic theming; missing files are ignored.
[include.optional]
files = ["noctalia.toml"]


# Colors ---------------------------------------------------------------------
# Overrides the palette Noctalia renders into noctalia.toml.

[colors]
background = "#141419F0"
text_primary = "#E8E8EAFF"
text_muted = "#8A8A92FF"
accent_primary = "#7AA3FFFF"
accent_secondary = "#F5C96BFF"
warning = "#F5C96BFF"
error = "#FF6B6BFF"
shadow = "#0000007F"

# Optional palette overrides -------------------------------------------------

# [colors.border] # focused, unfocused, outer
# focused = "#7AA3FFFF"
# unfocused = "#292933FF"
# outer = "#1A1A1FFF"
#
# [colors.overview] # background_tint, workspace_background, badge
#
# insert_hint = "#7FC8FF80" # colors.insert_hint
# backdrop = "#000000FF"    # colors.backdrop
