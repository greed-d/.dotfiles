# General — startup, workspaces, overview, hot corners, and window layout ----

# Core behavior --------------------------------------------------------------

[general]
autostart = ["qs -p ~/.config/astralis/shell.qml", "foot --server"]
mod_key = "Super"               # Mod in keybinds; defaults to Super (Alt when nested)
xwayland = true                 # requires restart to change
show_cheatsheet = false         # show keybinds overlay on startup
focus_on_activate = false       # activation requests mark urgent without stealing focus
honor_restored_maximize = false # let apps restore their saved maximized state

# Workspaces -----------------------------------------------------------------

[workspaces]
back_and_forth = true

# Overview -------------------------------------------------------------------

[overview]
zoom = 0.4 # 0.1-0.75
# background_blur = true # blur the wallpaper while the overview is open
# Overview colors (tint, workspace background, badge) live under [colors.overview].

# Hot corners ---------------------------------------------------------------

[hot_corners.top_left]
enabled = true
delay_ms = 50            # 0-10000, 0 activates immediately
action = "overview-open"

[hot_corners.top_right]
enabled = false
delay_ms = 500
action = "overview-close"

[hot_corners.bottom_left]
enabled = false
delay_ms = 500
action = "overview-toggle"

[hot_corners.bottom_right]
enabled = false
delay_ms = 500
action = "spawn:notify-send 'Bottom right'"

# Layout ---------------------------------------------------------------------

[layout]
mode = "scrolling"                  # "scrolling", "dwindle", or "master"
gap = 1                             # 0-500
extent_presets = [0.333, 0.5, 0.667] # shared by scrolling and dwindle

[layout.scrolling]
# Vertical workspaces stack horizontal lanes from top to bottom.
default_extent_fraction = 0.5  # remove to let clients choose their initial width
center_underfull_strip = true # center the strip whenever it is narrower than the viewport

# Per-workspace layout overrides (see docs/user/outputs.md#workspace-rules) ---

[[workspace]]
index = 7
layout.mode = "dwindle"

[[workspace]]
index = 8
layout.mode = "master"

# More overrides can match by name and tweak gaps and sub-layouts:
# [[workspace]]
# name = "chat"
# layout.mode = "dwindle"
# layout.gap = 4
# layout.scrolling.center_underfull_strip = false
