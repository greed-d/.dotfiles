# Window rules (see docs/user/rules.md) --------------------------------------
# Rule order matters: later matching rules override earlier ones.
# Workspace layout overrides live in core/general.toml.

# Global defaults — apply to every window ------------------------------------

# Blur all windows
[[window_rule]]
blur = true
blur_optimized = false

# Dim unfocused windows
[[window_rule]]
match.is_focused = false
opacity = 0.85

# Picture-in-picture stays sharp and floats in the bottom-right corner
[[window_rule]]
match.title="^(Picture in picture|Picture-in-picture|Picture-in-Picture)"
match.is_focused = false
default_position = { x = 10, y = 10, anchor = "bottom_right" }
default_floating = true
blur = false
opacity = 1

# Floating windows -----------------------------------------------------------

# Float utility windows
[[window_rule]]
match.app_id = "^(Emulator|zenity|xdg-desktop-portal-gtk|qalculate-gtk|org\\.pulseaudio\\.pavucontrol|one.alynx.showmethekey|dev.lemmy.swash)$"
default_floating = true

# Float common dialogs by title
[[window_rule]]
match.title = "^(Open File|Select|Choose a wallpaper|Open Folder|Save As|Library|Choose Where to Download|File Operation Progress|Rename|Copy Files|Move Files|Search Files|Bitwarden|DAMX|New Download|Add Download|All Files|Choose Files)"
default_floating = true

# Float dialogs, progress windows, and popups by title or app
[[window_rule]]
match.title = "^(file_progress|confirm|dialog|download|notification |error|splash|nwg-look|confirmreset|Delete profile)$|^File Operation Progress$|^Confirm to replace files$|^KDE Connect URL handler$|^(Open File|Select a File|Choose wallpaper|Open Folder|Save As|Library|File Upload).*$|Choose Where to Download|^(.*)-Google$|^(.*)System Update$|(.*) - Google (.*) - (.*)"
match.app_id = "^(xdm-app|org\\.qbittorrent\\.qBittorrent|org\\.pulseaudio\\.pavucontrol|net\\.davidotek\\.pupgui2|com\\.github\\.th_c\\.youtube_music|DivAcerManagerMax)$"
default_floating = true

# Application rules ----------------------------------------------------------

# Nautilus
[[window_rule]]
match.app_id = "(^org\\.gnome\\.Nautilus$|thunar|dolphin)"
blur = true
opacity = 0.9
default_maximize = true


# qbittorrent
[[window_rule]]
match.app_id = "org.qbittorrent.qBittorrent"
opacity = 0.95
default_floating = true
default_floating_size_px = { width = 1680, height = 900 }

# Helium
[[window_rule]]
match.app_id = "(^helium$|^zen-*|vivaldi-stable|librewolf)"
default_maximize_to_edges = true
default_workspace = 1

# Obsidian
[[window_rule]]
match.app_id = "(^[Oo]bsidian$|md.obsidian.Obsidian)"
opacity = 0.9
default_workspace = 7
default_floating = true
default_floating_size_px = { width = 1520, height = 995 }

# Spotify
[[window_rule]]
match.app_id = "^[Ss]potify$"
opacity = 0.9
default_workspace = 8
default_floating = true
default_floating_size_px = { width = 1520, height = 995 }

# Vesktop
[[window_rule]]
match.app_id = "^vesktop$"
# default_maximize_to_edges = true
default_maximize = true
default_workspace = 9
opacity = 0.9

# Telegram
[[window_rule]]
match.app_id = "^org.telegram.desktop$"
default_workspace = 10
default_maximize = true
opacity = 0.9

[[window_rule]]
match.app_id = "mpv"
default_fullscreen = true

# Noctalia
[[window_rule]]
match.app_id = "^dev.noctalia.Noctalia$"
default_floating = true
default_floating_size_px = { width = 1620, height = 1000 }

# Noctalia Share Picker
[[window_rule]]
match.app_id = "^dev.noctalia.UmbrielSharePicker$"
default_floating = true
default_floating_size_px = { width = 800, height = 600 }

# Terminals (blur) -----------------------------------------------------------

[[window_rule]]
match.app_id = "(kitty|ghostty|alacritty)"
blur = true
opacity = 0.99

# Open maximized -------------------------------------------------------------

[[window_rule]]
match.app_id = "^(com\\.github\\.th_c\\.youtube_music|Postman|Element|steam|Emacs|neovide)$"
default_maximize = true

# Download managers (floating) -----------------------------------------------

# Motrix
[[window_rule]]
match.app_id = "^Motrix$"
default_floating = true

# Motrix Next
[[window_rule]]
match.app_id = "^motrix-next$"
match.title = "^Motrix Next$"
default_floating = true

# AB Download Manager
[[window_rule]]
match.app_id = "^com-abdownloadmanager-desktop-AppKt$"
match.title = "^AB Download Manager$"
default_floating = true
default_floating_size_px = { width = 1550, height = 950 }

# AB Download Manager Settings
[[window_rule]]
match.app_id = "^com-abdownloadmanager-desktop-AppKt$"
match.title = "^Settings$"
default_floating = true

