# Appearance — borders, corners, blur, and shadows ---------------------------
# Colors live in config.toml ([colors]) so they override noctalia.toml.

# Borders & corners ----------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 1       # 0-100
outer_border_width = 0 # 0-100
corner_radius = 0      # 0-100
drag_opacity = 0.75    # window opacity while dragging, 0.0-1.0

# Blur -----------------------------------------------------------------------

[appearance.blur]
enabled = true
optimized = true
passes = 3       # 0-8
radius = 6       # 0-100
noise = 0.02     # 0.0-1.0
brightness = 0.9 # 0.0-2.0
contrast = 0.9   # 0.0-2.0
saturation = 1.1 # 0.0-2.0

# Shadows --------------------------------------------------------------------

[appearance.shadow]
enabled = true
softness = 10 # 0-200, 0 = hard edge
offset_x = 2  # -200 to 200
offset_y = 2
