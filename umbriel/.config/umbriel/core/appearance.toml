# Appearance — borders, corners, blur, and shadows ---------------------------
# Colors live in config.toml ([colors]) so they override noctalia.toml.

# Borders & corners ----------------------------------------------------------

[appearance]
prefer_no_csd = true
border_width = 1       # 0-100
outer_border_width = 0 # 0-100
corner_radius = 24     # 0-100
drag_opacity = 0.9     # window opacity while dragging, 0.0-1.0

# Tab bar --------------------------------------------------------------------

[appearance.tab_bar]
corner_radius = 18     # -1 follows corner_radius, 0-100
tab_gap = 6            # 0-64
padding = 12           # 0-64
height = 26            # 2-400
hide_when_single = true

# Blur -----------------------------------------------------------------------

[appearance.blur]
enabled = true
optimized = true
passes = 4       # 0-8
radius = 12      # 0-100
noise = 0.01     # 0.0-1.0
brightness = 1.0 # 0.0-2.0
contrast = 1.0   # 0.0-2.0
saturation = 1.2 # 0.0-2.0

# Shadows --------------------------------------------------------------------

[appearance.shadow]
enabled = true
softness = 28  # 0-200, 0 = hard edge
offset_x = 0   # -200 to 200
offset_y = 6   # -200 to 200
