#:schema ./schema.json

# Animations — timing and easing for every surface ---------------------------

# Defaults for all animations; the per-surface tables below override these.

[animation]
enabled = true
duration_ms = 150
curve = "easeout"

# Beziers — custom easing curves referenced by name in "curve" ---------------

[animation.beziers]
expressiveFastSpatial = [0.42, 1.67, 0.21, 0.90]
expressiveSlowSpatial = [0.39, 1.29, 0.35, 0.98]
expressiveDefaultSpatial = [0.38, 1.21, 0.22, 1.00]
emphasizedDecel = [0.05, 0.7, 0.1, 1.0]
emphasizedAccel = [0.3, 0.0, 0.8, 0.15]
standardDecel = [0.0, 0.0, 0.0, 1.0]
menu_decel = [0.1, 1.0, 0.0, 1.0]
menu_accel = [0.52, 0.03, 0.72, 0.08]
stall = [1.0, -0.1, 0.7, 0.85]

# Windows — open, close, and move --------------------------------------------
# windows_in.style:  "popin", "zoom", "slide", "fade", or "none"
# windows_out.style: "fade" or "slide"

[animation.windows_in]
enabled = true
duration_ms = 300
curve = "emphasizedDecel"
style = "popin"

[animation.windows_out]
enabled = true
duration_ms = 200
curve = "emphasizedDecel"
style = "slide"

[animation.windows_move]
enabled = true
duration_ms = 300
curve = "emphasizedDecel"

# Workspaces — switching between workspaces ----------------------------------

[animation.workspaces]
enabled = true
duration_ms = 700
curve = "menu_decel"

# Overview -------------------------------------------------------------------

[animation.overview]
enabled = true
duration_ms = 350
curve = "easeout"

# Layers — shell popups, panels, and OSDs ------------------------------------

[animation.layers]
enabled = true
duration_ms = 270
curve = "emphasizedDecel"

# Borders — color transitions on focus change --------------------------------

[animation.border]
enabled = true
duration_ms = 1000
curve = "emphasizedDecel"

# Scratchpad — entering and leaving the scratchpad ---------------------------

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "easeout"
dim = 0.5          # 0.0-1.0
blur = false       # requires appearance.blur.enabled
scale = 0.0        # 0 preserves geometry; 0.1-1.0 sizes and centers on entry
maximize = false   # maximize to edges on entry
fullscreen = false # fullscreen on entry

# Dim unfocused windows ------------------------------------------------------

[animation.dim_unfocused]
enabled = true
duration_ms = 250
curve = "easeout"
dim = 0.09 # 0.0-1.0
