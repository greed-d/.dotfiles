#:schema ./schema.json

# Animations — timing and easing for every surface ---------------------------

# Defaults for all animations; the per-surface tables below override these.

[animation]
enabled = true
duration_ms = 150
curve = "smooth"

# Beziers — custom easing curves referenced by name in "curve" ---------------
# Smooth, no-overshoot curves: fast start, silky settle, zero bounce.

[animation.beziers]
smooth = [0.16, 1.0, 0.30, 1.0] # expo-out — silky UI transitions
fluid  = [0.22, 1.0, 0.36, 1.0] # quint-out — larger spatial movement
decel  = [0.05, 0.7, 0.1, 1.0]  # gentle decelerate, no bounce
enter  = [0.16, 0.84, 0.28, 1.0] # soft settle for windows opening

# Windows — open, close, and move --------------------------------------------
# windows_in.style:  "popin", "zoom", "slide", "fade", or "none"
# windows_out.style: "fade" or "slide"

[animation.windows_in]
enabled = true
duration_ms = 400
curve = "enter"
style = "popin"

[animation.windows_out]
enabled = true
duration_ms = 300
curve = "smooth"
style = "zoom"
scale = 0.6 # shrink to 60% while fading out — visible but subtle zoom-out

[animation.windows_move]
enabled = true
duration_ms = 350
curve = "fluid"

# Workspaces — switching between workspaces ----------------------------------

[animation.workspaces]
enabled = true
duration_ms = 600
curve = "fluid"

# Overview -------------------------------------------------------------------

[animation.overview]
enabled = true
duration_ms = 400
curve = "smooth"

# Layers — shell popups, panels, and OSDs ------------------------------------

[animation.layers]
enabled = true
duration_ms = 300
curve = "decel"

# Borders — color transitions on focus change --------------------------------

[animation.border]
enabled = true
duration_ms = 1000
curve = "decel"

# Scratchpad — entering and leaving the scratchpad ---------------------------

[animation.scratchpad]
enabled = false
duration_ms = 250
curve = "smooth"
dim = 0.5          # 0.0-1.0
blur = false       # requires appearance.blur.enabled

# Dim unfocused windows ------------------------------------------------------
# Disabled: this animation dims ALL unfocused windows — including the PiP —
# on top of their surface opacity, which makes the PiP look transparent while
# unfocused even though its window rule pins opacity = 1. Global unfocused
# dimming is still handled by the window rule `match.is_focused = false,
# opacity = 0.85` in core/windowrule.toml; the PiP rule overrides that to 1.

[animation.dim_unfocused]
enabled = false
duration_ms = 250
curve = "smooth"
dim = 0.09 # 0.0-1.0
