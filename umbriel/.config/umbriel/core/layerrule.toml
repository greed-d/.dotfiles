# Layer rules — blur behind shell surfaces (see docs/user/rules.md#layer-rules)

# Noctalia bar, dock, panels, OSDs, and notifications
[[layer_rule]]
match.namespace = "^noctalia-(bar-[^\"]+|notification|dock|panel|attached-panel|osd)$"
blur = true
blur_optimized = false
blur_ignore_alpha = 0.5

# Vicinae launcher
[[layer_rule]]
match.namespace = "vicinae"
blur = true
blur_optimized = false
blur_ignore_alpha = 0.7

# Quickshell
[[layer_rule]]
match.namespace = "^quickshell$"
blur = true
blur_optimized = false
blur_ignore_alpha = 0.7
