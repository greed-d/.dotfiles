# Monitors / outputs (see docs/user/outputs.md) ------------------------------

# eDP-1 ----------------------------------------------------------------------

[output."eDP-1"]
# Geometry
mode = "1920x1080@165.000"
position = [0, 0]
scale = 1
# Display features
vrr = "disabled"  # "disabled" (default), "always", or "fullscreen"
hdr = "off"       # "off", "on", metadata-driven "auto", or any-app "fullscreen"
sdr_white = 203   # SDR reference white in cd/m2 while HDR is active
# Behavior
enabled = true    # false powers the monitor off and removes it from the desktop
workspaces = 10   # dynamic workspaces are the default; use a count or name list for static ones
